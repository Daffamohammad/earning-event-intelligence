[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-ml"
version = "0.1.0"
description = "Earnings-event intelligence and post-announcement return model (research framework)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "pandera>=0.18",
    "exchange_calendars>=4.4",
    "click>=8.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
real = ["yfinance>=0.2.30"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
earnings-ml = "earnings_ml.cli:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["earnings_ml*", "data_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring internet",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "earnings_ml.event_alignment.*"
strict = true

[[tool.mypy.overrides]]
module = "earnings_ml.features.*"
strict = true

[[tool.mypy.overrides]]
module = "earnings_ml.labels.*"
strict = true

[[tool.mypy.overrides]]
module = "earnings_ml.validation.*"
strict = true

[tool.coverage.run]
source = ["src/earnings_ml"]
omit = ["*/text_processing/embeddings.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
